spring.application.name=config-server-grupo03

server.port=8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.config.server.git.uri=https://github.com/Valarcong/git-repo-default-config
spring.cloud.config.server.git.default-label=main

spring.cloud.config.server.git.repos.comercial.pattern[0]=solicitud-*
spring.cloud.config.server.git.repos.comercial.uri=https://github.com/Valarcong/git-repo-comercial-fintech

spring.cloud.config.server.git.repos.riesgos.pattern[0]=evaluacion-*
spring.cloud.config.server.git.repos.riesgos.uri=https://github.com/Valarcong/git-repo-riesgos-fintech

